<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="./style.css">
  <title>Frontend Mentor | Todo app</title>

</head>


<body>
  <div class="banner"></div>

  <main class="todo-container">

    <header class="todo-header">
      <h1>To-Do App</h1>
      <button id="theme-toggle" aria-label="Toggle theme">
        <img id="moon-icon"src="./images/icon-moon.svg" alt="Toggle theme">
        <img id="sun-icon" src="./images/icon-sun.svg" alt="Toggle theme" class="hidden">
      </button>
    </header>

    <form id="todo-form" class="todo-card input-card">

      <input type="text" id="todo-input" placeholder="Create your todo">
      <button type="submit" class="add-btn">Add +</button>
    </form>

    <div class="todo-wrapper">
      <ul id="todo-list">
  
      </ul>
    </div>


    <div class="action-bar">
      <span id="todo-count">0 items left</span>
      <div class="filters desktop-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" class="hidden">Clear Completed</button>
    </div>
      
    <div class="mobile-filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
     Coded by <a href="#">Miguel Lugo</a>.
  </footer>

  <script src="app.js"></script>
</body>
</html>
